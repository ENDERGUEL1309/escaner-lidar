# Compila la app en un Mac en la nube de GitHub (sin firmar) y publica el .ipa como artefacto.
# Después se firma e instala desde Windows con Sideloadly usando tu Apple ID.
name: Compilar IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      # Las versiones recientes de Xcode no traen preinstalada la plataforma iOS en los runners:
      # sin ella, xcodebuild falla en segundos con "iOS XX is not installed" (exit 65).
      - name: Preparar plataforma iOS
        run: |
          xcodebuild -version
          if xcodebuild -project LidarScanner.xcodeproj -scheme LidarScanner -showdestinations 2>&1 | grep -qi "not installed"; then
            echo "Descargando plataforma iOS…"
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks

      - name: Compilar (sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project LidarScanner.xcodeproj \
            -scheme LidarScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LidarScanner.app Payload/
          zip -qry LidarScanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LidarScanner-ipa
          path: LidarScanner.ipa

      # Muestra los errores como anotaciones en el resumen de la ejecución (visibles sin descargar el log).
      - name: Resumir errores
        if: failure()
        run: |
          [ -f xcodebuild.log ] || exit 0
          grep -E "error:|BUILD FAILED|is not installed" xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-compilacion
          path: xcodebuild.log
