# Compila la app en un Mac en la nube de GitHub (sin firmar) y publica el .ipa como artefacto.
# Después se firma e instala desde Windows con Sideloadly usando tu Apple ID.
name: Compilar IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]

jobs:
  build:
    runs-on: macos-15-intel   # los Mac con chip Apple de GitHub a veces no tienen hueco
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      # Las versiones recientes de Xcode no traen preinstalada la plataforma iOS en los runners:
      # sin ella, xcodebuild falla en segundos con "iOS XX is not installed" (exit 65).
      - name: Preparar plataforma iOS
        run: |
          xcodebuild -version
          if xcodebuild -project LidarScanner.xcodeproj -scheme LidarScanner -showdestinations 2>&1 | grep -qi "not installed"; then
            echo "Descargando plataforma iOS…"
            xcodebuild -downloadPlatform iOS
          fi
          # Sin esto, los .metal fallan con "missing Metal Toolchain" en las versiones recientes de Xcode.
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showsdks

      - name: Compilar (sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project LidarScanner.xcodeproj \
            -scheme LidarScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      # Profundidad a partir del color (Depth Anything V2 Small de Apple, Apache-2.0). Si la descarga falla, la app
      # funciona igual y la validación «Color frente a LiDAR» simplemente no aparece.
      - name: Modelo de profundidad por color
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          repo = "apple/coreml-depth-anything-v2-small"
          prefix = "DepthAnythingV2SmallF16.mlpackage/"
          info = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}"))
          for f in (s["rfilename"] for s in info["siblings"]):
              if f.startswith(prefix):
                  os.makedirs(os.path.join("modelos", os.path.dirname(f)), exist_ok=True)
                  urllib.request.urlretrieve(f"https://huggingface.co/{repo}/resolve/main/{f}", os.path.join("modelos", f))
                  print(f)
          EOF
          xcrun coremlcompiler compile modelos/DepthAnythingV2SmallF16.mlpackage modelos/
          ls -la modelos/DepthAnythingV2SmallF16.mlmodelc

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LidarScanner.app Payload/
          if [ -d modelos/DepthAnythingV2SmallF16.mlmodelc ]; then
            cp -R modelos/DepthAnythingV2SmallF16.mlmodelc Payload/LidarScanner.app/
          else
            echo "::warning::Sin el modelo de profundidad por color"
          fi
          # Sideloadly instala lo que haya: mejor fallar aquí que descubrir en el iPhone que falta el icono o los shaders.
          test -f Payload/LidarScanner.app/Assets.car
          test -f Payload/LidarScanner.app/default.metallib
          plutil -extract CFBundleIcons xml1 -o - Payload/LidarScanner.app/Info.plist
          zip -qry LidarScanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LidarScanner-ipa
          path: LidarScanner.ipa

      # Muestra los errores como anotaciones en el resumen de la ejecución (visibles sin descargar el log).
      - name: Resumir errores
        if: failure()
        run: |
          [ -f xcodebuild.log ] || exit 0
          grep -E "error:|BUILD FAILED|is not installed" xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-compilacion
          path: xcodebuild.log
